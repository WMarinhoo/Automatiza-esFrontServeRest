name: Robot Framework TestCase  # Nome que aparece na aba Actions

on:
  push:
    branches: [ main ]          # Roda em todo push para main (seu "deploy")
  pull_request:
    branches: [ main ]          # Opcional: roda também em PRs para testar antes de merge
  workflow_dispatch:            # Opcional: permite rodar manualmente na aba Actions

jobs:
  robot-TestCase:
    runs-on: ubuntu-latest      # Máquina Linux gratuita e rápida

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Baixa seu código

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'    # Use 3.11 ou 3.10 se preferir (3.12 é estável em 2025/2026)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install robotframework
          # Adicione as bibliotecas que você usa (exemplos comuns):
          pip install robotframework-seleniumlibrary          # Para testes web com browser
          pip install robotframework-requests                 # Para APIs/HTTP
          pip install robotframework-appiumlibrary            # Se tiver mobile
          pip install robotframework-browser                  # Alternativa moderna ao Selenium (recomendado)
          # pip install -r requirements.txt                   # Se você tiver um arquivo requirements.txt com todas as deps

      - name: Install browser drivers (opcional, para SeleniumLibrary)
        if: success()  # Só roda se as instalações anteriores deram certo
        run: |
          # Para Chrome (padrão no ubuntu-latest)
          pip install webdriver-manager
          # Ou use robotframework-browser (mais fácil, sem driver manual)
          # rfbrowser init   # Rode isso se usar Browser Library

      - name: Run Robot Framework TestCase
        run: |
          # Comando básico: roda todos os .robot na pasta TestCase/
          robot --outputdir results --loglevel TRACE:INFO TestCase/
          
          # Exemplos alternativos (descomente o que precisar):
          # robot --outputdir results --include Smoke tests/               # Só cenários com tag @Smoke
          # robot --outputdir results --variable ENV:PROD tests/           # Passa variável de ambiente
          # robot --outputdir results --exclude NotReady tests/            # Ignora cenários pendentes
          # python -m robot.run --outputdir results tests/                 # Alternativa usando módulo

      - name: Upload results as artifact  # Salva relatórios mesmo se falhar (muito útil!)
        if: always()  # Roda sempre (sucesso ou falha)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/                # Pasta com log.html, report.html, output.xml
          retention-days: 7             # Mantém por 7 dias (ajuste se quiser)

      # Opcional: Envia relatório por email ou Slack se falhar (adicione se precisar)
      # - name: Notify on failure
      #   if: failure()
      #   uses: some-action-to-notify...
