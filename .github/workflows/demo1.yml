name: Robot Framework TestCase

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  robot-TestCase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install robotframework
          pip install robotframework-seleniumlibrary
          pip install robotframework-requests
          pip install robotframework-appiumlibrary
          pip install robotframework-browser
          pip install robotframework-databaselibrary
          pip install rpaframework
          # Se tiver requirements.txt → descomente:
          # pip install -r requirements.txt

      - name: Install browser drivers (opcional, para SeleniumLibrary)
        if: success()
        run: |
          pip install webdriver-manager
          # Se usar Browser Library (recomendado):
          # rfbrowser init

      - name: Install ServeRest (via npm)
        run: npm install -g serverest@latest

      - name: Start ServeRest in background
        run: |
          serverest start --port 3000 &
          sleep 10  # Espera o servidor iniciar

      - name: Run Robot Framework tests
        run: |
          robot --outputdir results \
                --loglevel TRACE:DEBUG \
                --variable BASE_URL:http://localhost:3000 \
                TestCase/

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
          retention-days: 7
